<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PTT Stock 熱門標的追蹤（每日）</title>
<style>
  /* mono-color：紙張 Pale Beige #F5F1E8、Oxblood #4A1F1F/#8F3434、綠墨 #00753F。
     與報告內頁同一套配方，見 .claude/skills/mono-color/ATTRIBUTION.md */
  * { box-sizing: border-box; margin: 0; }
  body {
    height: 100vh; display: flex; flex-direction: column;
    background: #F5F1E8; color: #4A1F1F;
    font-family: "Helvetica Neue", Helvetica, "PingFang TC",
                 "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  .tabbar {
    display: flex; align-items: center; gap: 14px; padding: 12px 20px;
    border-bottom: 2px solid #4A1F1F; flex-wrap: wrap;
  }
  .brand {
    font-weight: 700; letter-spacing: .18em; color: #4A1F1F;
    margin-right: 4px; font-size: .78rem; text-transform: uppercase;
  }
  /* --- 日期選擇器 --- */
  .picker { position: relative; }
  .datebtn {
    display: inline-flex; align-items: center; gap: 8px;
    background: #8F3434; border: 1px solid #8F3434; color: #F5F1E8;
    padding: 6px 14px; font-size: .82rem; font-weight: 700;
    cursor: pointer; font-variant-numeric: tabular-nums;
    font-family: inherit; letter-spacing: .04em;
  }
  .datebtn:hover { background: #4A1F1F; border-color: #4A1F1F; }
  .datebtn .caret { font-size: .66rem; opacity: .75; }
  .today-flag {
    border: 1px solid rgba(245,241,232,.5);
    padding: 0 7px; font-size: .68rem; letter-spacing: .08em;
  }
  /* 透明遮罩：iframe 會吃掉點擊事件，沒有它就無法「點報告區關閉日曆」 */
  .scrim { position: fixed; inset: 0; z-index: 40; }
  .scrim[hidden] { display: none; }
  .cal {
    position: absolute; top: calc(100% + 8px); left: 0; z-index: 50;
    background: #F5F1E8; border: 2px solid #4A1F1F;
    padding: 14px; width: 268px;
  }
  .cal[hidden] { display: none; }
  .cal-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px; padding-bottom: 8px;
    border-bottom: 1px solid rgba(74,31,31,.28);
  }
  .cal-title {
    font-size: .82rem; font-weight: 700; color: #4A1F1F;
    font-variant-numeric: tabular-nums; letter-spacing: .04em;
  }
  .cal-nav {
    background: transparent; border: 1px solid rgba(74,31,31,.4); color: #4A1F1F;
    width: 26px; height: 26px; cursor: pointer;
    font-size: .9rem; line-height: 1; font-family: inherit;
  }
  .cal-nav:hover:not(:disabled) { background: #4A1F1F; color: #F5F1E8; }
  .cal-nav:disabled { opacity: .25; cursor: default; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-wd {
    text-align: center; font-size: .66rem; color: #4A1F1F; opacity: .55;
    padding: 4px 0 6px; letter-spacing: .06em;
  }
  .cal-d {
    aspect-ratio: 1; border: 0; background: transparent;
    color: rgba(74,31,31,.3); font-size: .8rem; cursor: default;
    font-variant-numeric: tabular-nums; font-family: inherit;
  }
  /* 有報告的日期才可點 */
  .cal-d.has {
    color: #4A1F1F; border: 1px solid rgba(74,31,31,.28);
    cursor: pointer; font-weight: 700;
  }
  .cal-d.has:hover { background: #4A1F1F; color: #F5F1E8; }
  .cal-d.sel { background: #8F3434; border-color: #8F3434; color: #F5F1E8; }
  .cal-empty { visibility: hidden; }
  .cal-foot {
    margin-top: 10px; padding-top: 8px; font-size: .68rem;
    border-top: 1px solid rgba(74,31,31,.28);
    color: #4A1F1F; opacity: .55; text-align: center;
  }
  iframe { flex: 1; border: 0; width: 100%; background: #F5F1E8; }
</style>
</head>
<body>
  <div class="scrim" id="scrim" hidden></div>
  <div class="tabbar">
    <span class="brand">PTT STOCK 每日追蹤</span>
    <div class="picker">
      <button class="datebtn" id="datebtn" aria-haspopup="dialog" aria-expanded="false">
        <span id="datelabel"></span><span class="caret">▼</span>
      </button>
      <div class="cal" id="cal" role="dialog" aria-label="選擇日期" hidden>
        <div class="cal-head">
          <button class="cal-nav" id="prev" aria-label="上個月">‹</button>
          <span class="cal-title" id="caltitle"></span>
          <button class="cal-nav" id="next" aria-label="下個月">›</button>
        </div>
        <div class="cal-grid" id="calgrid"></div>
        <div class="cal-foot">只有產出報告的日期可以選取</div>
      </div>
    </div>
  </div>
  <iframe id="frame" src="report_2026-09-03.html" title="每日報告"></iframe>
<script>
  var DAYS = ["2026-07-10", "2026-07-13", "2026-07-14", "2026-07-15", "2026-07-16", "2026-07-17", "2026-07-18", "2026-07-19", "2026-07-20", "2026-07-21", "2026-07-22", "2026-07-23", "2026-07-24", "2026-07-25", "2026-07-26", "2026-07-27", "2026-07-28", "2026-07-29", "2026-07-30", "2026-07-31", "2026-08-01", "2026-08-02", "2026-08-03", "2026-08-04", "2026-08-05", "2026-08-07", "2026-08-08", "2026-08-09", "2026-08-10", "2026-08-11", "2026-08-12", "2026-08-13", "2026-08-14", "2026-08-15", "2026-08-16", "2026-08-17", "2026-08-18", "2026-08-19", "2026-08-20", "2026-08-21", "2026-08-22", "2026-08-23", "2026-08-24", "2026-08-25", "2026-08-26", "2026-08-28", "2026-08-29", "2026-08-30", "2026-08-31", "2026-09-01", "2026-09-02", "2026-09-03"];
  var LATEST = "2026-09-03";
  var avail = new Set(DAYS);
  var selected = LATEST;

  var btn = document.getElementById("datebtn");
  var label = document.getElementById("datelabel");
  var cal = document.getElementById("cal");
  var grid = document.getElementById("calgrid");
  var title = document.getElementById("caltitle");
  var prev = document.getElementById("prev");
  var next = document.getElementById("next");
  var frame = document.getElementById("frame");
  var scrim = document.getElementById("scrim");

  function pad(n) { return String(n).padStart(2, "0"); }
  function iso(y, m, d) { return y + "-" + pad(m + 1) + "-" + pad(d); }
  function parse(s) {
    var p = s.split("-");
    return { y: +p[0], m: +p[1] - 1, d: +p[2] };
  }

  // 可選月份的範圍：不讓使用者翻到完全沒有資料的月份
  var first = parse(DAYS[0]);
  var last = parse(DAYS[DAYS.length - 1]);
  var minIdx = first.y * 12 + first.m;
  var maxIdx = last.y * 12 + last.m;

  var view = parse(selected);
  var viewY = view.y, viewM = view.m;

  function setLabel() {
    label.textContent = selected;
    var flag = document.querySelector(".today-flag");
    if (flag) flag.remove();
    if (selected === LATEST) {
      var s = document.createElement("span");
      s.className = "today-flag";
      s.textContent = "今天";
      label.after(s);
    }
  }

  function renderCal() {
    title.textContent = viewY + " 年 " + (viewM + 1) + " 月";
    var idx = viewY * 12 + viewM;
    prev.disabled = idx <= minIdx;
    next.disabled = idx >= maxIdx;

    grid.textContent = "";
    ["日", "一", "二", "三", "四", "五", "六"].forEach(function (w) {
      var e = document.createElement("div");
      e.className = "cal-wd";
      e.textContent = w;
      grid.appendChild(e);
    });

    var lead = new Date(viewY, viewM, 1).getDay();
    var total = new Date(viewY, viewM + 1, 0).getDate();
    for (var i = 0; i < lead; i++) {
      var pad0 = document.createElement("button");
      pad0.className = "cal-d cal-empty";
      pad0.disabled = true;
      grid.appendChild(pad0);
    }
    for (var d = 1; d <= total; d++) {
      var key = iso(viewY, viewM, d);
      var cell = document.createElement("button");
      cell.className = "cal-d";
      cell.textContent = d;
      if (avail.has(key)) {
        cell.classList.add("has");
        if (key === selected) cell.classList.add("sel");
        cell.dataset.day = key;
      } else {
        cell.disabled = true;      // 沒有報告的日子不可點
      }
      grid.appendChild(cell);
    }
  }

  function openCal(open) {
    cal.hidden = !open;
    scrim.hidden = !open;
    btn.setAttribute("aria-expanded", open ? "true" : "false");
    if (open) {
      var v = parse(selected);
      viewY = v.y; viewM = v.m;
      renderCal();
    }
  }

  btn.addEventListener("click", function (e) {
    e.stopPropagation();
    openCal(cal.hidden);
  });
  cal.addEventListener("click", function (e) {
    e.stopPropagation();
    var day = e.target.dataset && e.target.dataset.day;
    if (!day) return;
    selected = day;
    frame.src = "report_" + day + ".html";
    setLabel();
    openCal(false);
  });
  prev.addEventListener("click", function () {
    if (--viewM < 0) { viewM = 11; viewY--; }
    renderCal();
  });
  next.addEventListener("click", function () {
    if (++viewM > 11) { viewM = 0; viewY++; }
    renderCal();
  });
  scrim.addEventListener("click", function () { openCal(false); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") openCal(false);
  });

  setLabel();
</script>
</body>
</html>
